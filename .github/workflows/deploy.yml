name: Deploy PWA

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject commit SHA into sw.js
        run: |
          COMMIT_SHA=$(git rev-parse --short HEAD)
          sed -i "s/beauty-master-v2\.7/beauty-master-${COMMIT_SHA}/" sw.js
          echo "Проверка версии в sw.js:"
          grep "CACHE_NAME" sw.js

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
